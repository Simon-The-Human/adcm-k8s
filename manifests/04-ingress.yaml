apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adcm-ingress
  namespace: adcm-sandbox
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: adcm.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adcm
                port:
                  number: 8000
